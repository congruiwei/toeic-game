<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">董事会在候选政策上打勾，再把同一份规则放上正式公告栏。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(74 110) scale(1)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/><path d="M-15-20h30M-15-7h30M-15 7h30M-15 21h18" fill="none" /></g><g transform="translate(74 61) scale(1)"><path d="M-12 0l8 8 17-20" fill="none" stroke="var(--green)" stroke-width="5"/></g><path d="M119 110L191 110" fill="none" marker-end="url(#arr)"/><rect x="215" y="52" width="100" height="116" rx="5" fill="var(--gold)"/><g transform="translate(265 111) scale(0.9)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/><path d="M-15-20h30M-15-7h30M-15 7h30M-15 21h18" fill="none" /></g><text x="74" y="196" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">表决通过</text><text x="265" y="196" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">正式采用</text></g></svg>