<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">一张地图只高亮其中一个区域，区域内三家分店被连接。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M51 48h253v127H51Z" fill="var(--paper)" /><path d="M51 48h128v127H51Z" fill="var(--mint)" /><path d="M179 48l43 59 82 5M179 150l43-43" fill="none" /><circle cx="79" cy="81" r="7" fill="var(--blue)"/><circle cx="143" cy="94" r="7" fill="var(--blue)"/><circle cx="104" cy="147" r="7" fill="var(--blue)"/><path d="M79 81l64 13-39 53Z" fill="none" /><text x="180" y="205" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">区域内的分店网络</text></g></svg>