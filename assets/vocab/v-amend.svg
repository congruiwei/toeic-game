<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">合同原有的一行被划掉，箭头指向新增修订的一行。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(164 111) scale(1.7)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/><path d="M-15-20h30M-15-7h30M-15 7h30M-15 21h18" fill="none" /></g><path d="M135 100h50" fill="none" stroke="var(--red)" stroke-width="4"/><path d="M137 119h55" fill="none" stroke="var(--green)" stroke-width="4"/><path d="M255 88q25 35-43 35" fill="none" marker-end="url(#arr)"/><text x="272" y="77" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">修订</text><text x="97" y="199" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">合同条款</text></g></svg>