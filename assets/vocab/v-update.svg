<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">旧目录的一行资料被划去，修订后的目录用高亮新资料替换了对应一行。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="38" y="44" width="96" height="115" rx="5" fill="var(--paper)"/><path d="M47 57h78m-78 11h78m-78 11h78" fill="none" /><rect x="47" y="99" width="78" height="29" rx="5" fill="var(--red)"/><text x="86" y="119" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">旧资料</text><path d="M49 101l74 24" fill="none" /><path d="M146 103L205 103" fill="none" marker-end="url(#arr)"/><rect x="220" y="44" width="96" height="115" rx="5" fill="var(--paper)"/><path d="M229 57h78m-78 11h78m-78 11h78" fill="none" /><rect x="229" y="99" width="78" height="29" rx="5" fill="var(--mint)"/><text x="268" y="119" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">新资料</text><path d="M286 150l5 5 11-13" fill="none" stroke-width="3.5"/><text x="179" y="195" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">修订原目录</text></g></svg>