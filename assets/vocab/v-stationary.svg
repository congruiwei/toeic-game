<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">装满箱子的推车轮子被止轮块固定，车保持静止。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(181 118) scale(1.5)"><rect x="-30" y="-22" width="60" height="37" rx="5" fill="var(--blue)"/><path d="M-30 15h70v-50" fill="none" /><circle cx="-20" cy="23" r="7" fill="var(--ink)"/><circle cx="25" cy="23" r="7" fill="var(--ink)"/></g><g transform="translate(168 63) scale(0.8)"><path d="M-24-18h48v42h-48Z" fill="var(--gold)" /><path d="M0-18v16M-24-18l8-12h32l8 12" fill="none" /></g><path d="M128 165h23l-4-21Z" fill="var(--gold)" /><path d="M211 165h23l-4-21Z" fill="var(--gold)" /><path d="M64 167h236" fill="none" /><text x="180" y="202" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">轮子已固定，不移动</text></g></svg>