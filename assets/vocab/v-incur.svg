<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">延迟归还的租车触发一张新增费用单，表示因此产生费用。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(76 103) scale(0.9)"><path d="M-40 9v-21h16l13-22h31l16 22h10v21Z" fill="var(--blue)" /><circle cx="-23" cy="12" r="9" fill="var(--paper)"/><circle cx="28" cy="12" r="9" fill="var(--paper)"/><path d="M-13-15h36" fill="none" /></g><g transform="translate(81 161) scale(0.7)"><circle cx="0" cy="0" r="25" fill="var(--paper)"/><path d="M0-16V0l12 7" fill="none" /></g><path d="M130 110L190 110" fill="none" marker-end="url(#arr)"/><g transform="translate(256 108) scale(1)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/></g><text x="256" y="111" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">+$30</text><text x="79" y="202" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">逾期归还</text><text x="255" y="202" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">产生费用</text></g></svg>