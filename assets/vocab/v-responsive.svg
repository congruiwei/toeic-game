<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">三次客户消息发出后都迅速收到回信，每一对消息都有返回箭头。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(76 61) scale(0.55)"><rect x="-32" y="-21" width="64" height="42" rx="5" fill="var(--paper)"/><path d="M-32-21L0 4 32-21" fill="none" /></g><g transform="translate(280 61) scale(0.55)"><rect x="-32" y="-21" width="64" height="42" rx="5" fill="var(--paper)"/><path d="M-32-21L0 4 32-21" fill="none" /></g><path d="M110 54L246 54" fill="none" marker-end="url(#arr)"/><path d="M246 70L110 70" fill="none" marker-end="url(#arr)"/><g transform="translate(76 114) scale(0.55)"><rect x="-32" y="-21" width="64" height="42" rx="5" fill="var(--paper)"/><path d="M-32-21L0 4 32-21" fill="none" /></g><g transform="translate(280 114) scale(0.55)"><rect x="-32" y="-21" width="64" height="42" rx="5" fill="var(--paper)"/><path d="M-32-21L0 4 32-21" fill="none" /></g><path d="M110 107L246 107" fill="none" marker-end="url(#arr)"/><path d="M246 123L110 123" fill="none" marker-end="url(#arr)"/><g transform="translate(76 167) scale(0.55)"><rect x="-32" y="-21" width="64" height="42" rx="5" fill="var(--paper)"/><path d="M-32-21L0 4 32-21" fill="none" /></g><g transform="translate(280 167) scale(0.55)"><rect x="-32" y="-21" width="6