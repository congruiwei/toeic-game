<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">飞机仍在空中朝机场和跑道下降，尚未落地。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M38 66l51 7 31-20 10 6-20 20 53 14-4 10-61-7-26 21-12-5 15-21-39-12Z" fill="var(--paper)" /><path d="M178 121q34 22 45 28" fill="none" stroke-dasharray="5 5" marker-end="url(#arr)"/><path d="M192 177h137m-113-8h15m14 0h15m14 0h15" fill="none" /><rect x="271" y="84" width="55" height="70" rx="5" fill="var(--paper)"/><rect x="279" y="94" width="12" height="10" rx="1" fill="var(--blue)"/><rect x="279" y="113" width="12" height="10" rx="1" fill="var(--blue)"/><rect x="301" y="94" width="12" height="10" rx="1" fill="var(--blue)"/><rect x="301" y="113" width="12" height="10" rx="1" fill="var(--blue)"/><rect x="292" y="134" width="15" height="20" rx="1" fill="var(--mint)"/><text x="109" y="34" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">尚在进近</text><text x="269" y="205" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">机场</text></g></svg>