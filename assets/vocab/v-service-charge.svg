<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">餐厅账单将餐费100与另加的服务费10分开列出。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="86" y="31" width="190" height="164" rx="5" fill="var(--paper)"/><text x="181" y="59" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">账单</text><path d="M104 72h152" fill="none" /><text x="181" y="102" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="16">餐费      100</text><rect x="99" y="115" width="165" height="33" rx="5" fill="var(--gold)"/><text x="181" y="138" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="16">服务费     10</text><text x="181" y="180" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="16">合计      110</text></g></svg>