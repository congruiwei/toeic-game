<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">存款留在银行一段时间后，本金仍在，并另增一小份利息。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="139" y="38" width="76" height="83" rx="5" fill="var(--paper)"/><rect x="147" y="48" width="12" height="10" rx="1" fill="var(--blue)"/><rect x="147" y="67" width="12" height="10" rx="1" fill="var(--blue)"/><rect x="169" y="48" width="12" height="10" rx="1" fill="var(--blue)"/><rect x="169" y="67" width="12" height="10" rx="1" fill="var(--blue)"/><rect x="160" y="101" width="15" height="20" rx="1" fill="var(--mint)"/><g transform="translate(25 81) scale(1)"><rect x="0" y="0" width="52" height="28" rx="3" fill="var(--mint)"/><circle cx="26" cy="14" r="8" fill="var(--paper)"/><path d="M7 8v12m38-12v12" fill="none" /></g><path d="M83 95L127 95" fill="none" marker-end="url(#arr)"/><circle cx="176" cy="157" r="23" fill="var(--paper)"/><g transform="translate(176 157)"><path d="M0 0v-12l0 12 10 5" fill="none" /></g><path d="M224 95L265 95" fill="none" marker-end="url(#arr)"/><g transform="translate(275 73) scale(1)"><rect x="0" y="0" width="52" height="28" rx="3" fill="var(--mint)"/><circle cx="26" cy="14" r="8" fill="var(--paper)"/><path d="M7 8v12m38-12v12" fill="none" /></g><circle cx="302" cy="123" r="13" fill="var(--orange)"/><path d="M286 123h32m-16-7v14" fill="none" /><text x="53" y="143" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">存入</text><text x="302" y="163" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">本金＋利息</text><text x="176" y="207" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">经过一段时间</text></g></svg>