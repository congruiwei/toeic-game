<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">画笔参照原貌照片，把破损的装饰花纹补回原来的形状。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="29" y="36" width="76" height="65" rx="2" fill="var(--paper)"/><path d="M46 76q0-27 22-27t22 27Z" fill="var(--blue)" /><path d="M57 65l11-11 11 11-11 12Z" fill="var(--orange)" /><rect x="145" y="35" width="183" height="134" rx="5" fill="var(--paper)"/><path d="M161 143q0-82 74-82t75 82Z" fill="var(--blue)" /><path d="M206 113l29-30 29 30-29 29Z" fill="var(--orange)" /><path d="M235 83l2 18-13 11 11 10-8 13" fill="none" stroke-dasharray="3 4"/><path d="M276 183l-20-36m-4-6 12-5-2 14Z" fill="var(--orange)" /><path d="M110 70L138 70" fill="none" marker-end="url(#arr)"/><text x="66" y="125" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">原貌照片</text><text x="227" y="203" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">恢复原样</text></g></svg>