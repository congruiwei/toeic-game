<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">临时柜台只在维修期内使用，时间轴结束后回到原来的柜台。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(78 105) scale(0.8)"><rect x="-43" y="-8" width="86" height="12" rx="2" fill="var(--gold)"/><path d="M-35 4v40M35 4v40" fill="none" /></g><text x="78" y="67" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">临时柜台</text><path d="M127 105L203 105" fill="none" marker-end="url(#arr)"/><g transform="translate(273 105) scale(0.9)"><rect x="-43" y="-8" width="86" height="12" rx="2" fill="var(--gold)"/><path d="M-35 4v40M35 4v40" fill="none" /></g><text x="272" y="66" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">原柜台</text><path d="M43 162h90M133 153v18" fill="none" /><text x="95" y="198" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">仅维修期间</text></g></svg>