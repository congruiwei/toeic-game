<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">接电话的员工主动走到办公区门外，让同事安静工作。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(83 137) scale(1)"><rect x="-43" y="-8" width="86" height="12" rx="2" fill="var(--gold)"/><path d="M-35 4v40M35 4v40" fill="none" /></g><g transform="translate(84 88) scale(0.7)"><circle cx="0" cy="-25" r="10" fill="var(--paper)"/><path d="M-18 27V2Q0-12 18 2V27" fill="var(--blue)" /><path d="M-9 27v20M9 27v20M-18 8l-13 17M18 8l13 17" fill="none" /></g><rect x="173" y="37" width="14" height="150" rx="5" fill="var(--gold)"/><g transform="translate(269 115) scale(0.8)"><circle cx="0" cy="-25" r="10" fill="var(--paper)"/><path d="M-18 27V2Q0-12 18 2V27" fill="var(--mint)" /><path d="M-9 27v20M9 27v20M-18 8l-13 17M18 8l13 17" fill="none" /></g><rect x="282" y="82" width="12" height="22" rx="5" fill="var(--paper)"/><path d="M209 163L265 163" fill="none" marker-end="url(#arr)"/><text x="87" y="200" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">安静工作</text><text x="270" y="200" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">到门外接电话</text></g></svg>