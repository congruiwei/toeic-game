<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">规则在7月1日开始生效，时间轴之前为灰色，之后为绿色并可执行。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(178 86) scale(1.05)"><rect x="-30" y="-30" width="60" height="60" rx="5" fill="var(--paper)"/><rect x="-30" y="-30" width="60" height="14" rx="5" fill="var(--blue)"/><path d="M-16-36v12M16-36v12" fill="none" /><text x="0" y="15" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">7 / 1</text></g><path d="M34 162h143" fill="none" stroke="var(--blue)" stroke-width="7"/><path d="M181 162h141" fill="none" stroke="var(--green)" stroke-width="7"/><path d="M180 129v48" fill="none" /><g transform="translate(83 161) scale(0.6)"><path d="M-9-9L9 9M9-9L-9 9" fill="none" stroke="var(--red)" stroke-width="4"/></g><g transform="translate(275 161) scale(0.7)"><path d="M-12 0l8 8 17-20" fill="none" stroke="var(--green)" stroke-width="5"/></g><text x="83" y="199" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">尚未生效</text><text x="273" y="199" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">正式生效</text></g></svg>