<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">一张100美元纸币与15000日元金额由双向箭头连接，展示兑换比例示例。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(72 109) scale(1.2)"><rect x="-28" y="-16" width="56" height="32" rx="5" fill="var(--mint)"/><circle cx="0" cy="0" r="10" fill="var(--paper)"/><path d="M-20 0h3M17 0h3" fill="none" /></g><text x="72" y="166" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">USD 100</text><path d="M132 94L229 94" fill="none" marker-end="url(#arr)"/><path d="M229 125L132 125" fill="none" marker-end="url(#arr)"/><g transform="translate(289 109) scale(1.2)"><rect x="-28" y="-16" width="56" height="32" rx="5" fill="var(--mint)"/><circle cx="0" cy="0" r="10" fill="var(--paper)"/><path d="M-20 0h3M17 0h3" fill="none" /></g><text x="289" y="166" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">JPY 15000</text><text x="180" y="200" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">兑换比例示例</text></g></svg>