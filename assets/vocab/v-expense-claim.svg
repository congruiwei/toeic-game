<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">员工把收据钉在报销申请表后，一并交给财务受理托盘。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(97 100) scale(1.2)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/><path d="M-15-20h30M-15-7h30M-15 7h30M-15 21h18" fill="none" /></g><g transform="translate(147 124) scale(0.7)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/><path d="M-15-20h30M-15-7h30M-15 7h30M-15 21h18" fill="none" /></g><path d="M126 85q10-9 10 4v15" fill="none" stroke="var(--red)"/><path d="M194 110L224 110" fill="none" marker-end="url(#arr)"/><rect x="246" y="126" width="72" height="28" rx="5" fill="var(--blue)"/><text x="97" y="44" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">报销申请</text><text x="278" y="184" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">财务</text></g></svg>