<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">损坏的旧设备被一台完好的替换品换下。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(90 103) scale(1)"><rect x="-33" y="-27" width="66" height="54" rx="4" fill="var(--blue)"/><path d="M0 -27l-10 15 15 10 -16 15 8 14" fill="none"/></g><g transform="translate(270 103) scale(1)"><rect x="-40" y="-34" width="80" height="69" rx="4" fill="var(--blue)"/><rect x="-29" y="-25" width="36" height="38" rx="4" fill="var(--paper)"/><circle cx="24" cy="-15" r="5" fill="var(--orange)"/><circle cx="24" cy="5" r="5" fill="var(--mint)"/><path d="M-23 6l9 -18 13 18M-29 20h57" fill="none"/></g><path d="M134 103L224 103" fill="none" marker-end="url(#arr)"/><text x="90" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">损坏</text><text x="270" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">替换品</text></g></svg>