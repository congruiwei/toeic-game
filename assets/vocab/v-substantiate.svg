<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">两份独立原始记录用连线共同支持中央的一项结论，结论得到核实。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="38" width="67" height="74" rx="5" fill="var(--paper)"/><path d="M34 51h49m-49 11h49m-49 11h49" fill="none" /><rect x="25" y="133" width="67" height="59" rx="5" fill="var(--paper)"/><path d="M34 146h49m-49 11h49m-49 11h49" fill="none" /><path d="M38 179l9 6 16-17" fill="none" /><rect x="199" y="64" width="126" height="87" rx="5" fill="var(--mint)"/><path d="M256 106l5 5 11-13" fill="none" stroke-width="3.5"/><path d="M97 78L193 96" fill="none" marker-end="url(#arr)"/><path d="M97 162L193 123" fill="none" marker-end="url(#arr)"/><text x="59" y="28" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">原始记录</text><text x="261" y="179" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">证据支持结论</text></g></svg>