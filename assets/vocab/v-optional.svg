<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">表单有两个可选附加项，勾选一个、留空一个都能继续下一步。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="55" y="43" width="161" height="132" rx="5" fill="var(--paper)"/><rect x="74" y="66" width="23" height="23" rx="5" fill="var(--mint)"/><g transform="translate(86 77) scale(0.5)"><path d="M-12 0l8 8 17-20" fill="none" stroke="var(--green)" stroke-width="5"/></g><rect x="74" y="113" width="23" height="23" rx="5" fill="var(--paper)"/><path d="M115 78h79M115 125h79" fill="none" /><path d="M229 110L291 110" fill="none" marker-end="url(#arr)"/><g transform="translate(311 110) scale(0.8)"><path d="M-12 0l8 8 17-20" fill="none" stroke="var(--green)" stroke-width="5"/></g><text x="137" y="204" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">按需选择</text></g></svg>