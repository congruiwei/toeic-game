<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">整条总成本旁只有极窄的一丝小费差额，视觉上几乎可忽略。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="39" y="87" width="282" height="48" rx="0" fill="var(--blue)"/><rect x="317" y="87" width="4" height="48" rx="0" fill="var(--gold)"/><path d="M281 54L317 80" fill="none" marker-end="url(#arr)"/><text x="238" y="43" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">极小差额</text><text x="181" y="184" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">相对于总额非常小</text></g></svg>