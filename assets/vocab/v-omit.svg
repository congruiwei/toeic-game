<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">清单的三条彩色项目经过复制后只留下第一和第三条，中间虚线空位表示省略。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(72 110) scale(1.2)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/></g><path d="M121 110L196 110" fill="none" marker-end="url(#arr)"/><rect x="224" y="69" width="65" height="90" rx="5" fill="var(--paper)"/><path d="M238 112h37" fill="none" stroke-dasharray="4 4"/><text x="179" y="198" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="15">略去第二项</text><rect x="61" y="80" width="20" height="6" rx="2" fill="var(--green)" stroke="none"/><rect x="61" y="104" width="20" height="6" rx="2" fill="var(--gold)" stroke="none"/><rect x="61" y="129" width="20" height="6" rx="2" fill="var(--blue)" stroke="none"/><rect x="247" y="86" width="20" height="6" rx="2" fill="var(--green)" stroke="none"/><rect x="247" y="132" width="20" height="6" rx="2" fill="var(--blue)" stroke="none"/></g></svg>