<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">下单的订单和到货的包裹位于时间轴两端，双端标尺量出两者之间的三周。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="42" width="67" height="83" rx="5" fill="var(--paper)"/><path d="M44 55h49m-49 11h49m-49 11h49" fill="none" /><path d="M62 99l5 5 11-13" fill="none" stroke-width="3.5"/><rect x="254" y="61" width="70" height="54" rx="1" fill="var(--orange)"/><path d="M289.0 61v54m-35.0 -45h70" fill="none" /><path d="M112 88L241 88" fill="none" marker-end="url(#arr)"/><path d="M44 155h270m-270-9v18m270-18v18" fill="none" /><text x="70" y="190" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">下单</text><text x="180" y="145" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">3周</text><text x="288" y="190" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">到货</text></g></svg>