<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">信用额度条到1000即止，已用700，剩下300仍为空白。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="91" width="280" height="42" rx="0" fill="var(--paper)"/><rect x="40" y="91" width="196" height="42" rx="0" fill="var(--blue)"/><path d="M320 72v81" fill="none" stroke="var(--red)" stroke-width="5"/><text x="136" y="118" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="16">已用700</text><text x="278" y="118" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="16">可用300</text><text x="277" y="58" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="15">上限1000</text></g></svg>