<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">支付租用费用后获得钥匙，期限结束需要归还。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(65 103) scale(0.85)"><rect x="-31" y="-19" width="62" height="38" rx="4" fill="var(--mint)"/><circle cx="0" cy="0" r="11" fill="var(--paper)"/><path d="M-22 0h4M18 0h4" fill="none"/></g><g transform="translate(180 103) scale(0.85)"><circle cx="-18" cy="0" r="16" fill="var(--orange)"/><circle cx="-18" cy="0" r="6" fill="var(--paper)"/><path d="M-2 -4h37v10H24v9H14v-9H-2Z" fill="var(--orange)"/></g><g transform="translate(295 103) scale(0.85)"><circle cx="0" cy="0" r="29" fill="var(--paper)"/><path d="M0 -21v23l15 9M-22 0h3M22 0h-3M0 22v-3" fill="none"/></g><path d="M109 103L134 103" fill="none" marker-end="url(#arr)"/><path d="M224 103L249 103" fill="none" marker-end="url(#arr)"/><text x="65" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">支付</text><text x="180" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">使用</text><text x="295" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">到期归还</text></g></svg>