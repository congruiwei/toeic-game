<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">带虚线边框的暂定日程旁有问号，通向仍未完成的审批勾。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="53" y="53" width="91" height="112" rx="5" fill="var(--paper)"/><g transform="translate(99 98) scale(0.7)"><rect x="-30" y="-30" width="60" height="60" rx="5" fill="var(--paper)"/><rect x="-30" y="-30" width="60" height="14" rx="5" fill="var(--blue)"/><path d="M-16-36v12M16-36v12" fill="none" /><text x="0" y="15" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="23">18</text></g><path d="M43 44h111v130H43Z" fill="none" stroke-dasharray="5 5"/><text x="99" y="159" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">?</text><path d="M167 109L221 109" fill="none" marker-end="url(#arr)"/><circle cx="278" cy="108" r="30" fill="var(--paper)"/><path d="M262 107l11 10 21-25" fill="none" stroke-dasharray="4 5"/><text x="180" y="207" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">暂定，等待批准</text></g></svg>