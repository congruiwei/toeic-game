<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">电脑通过插入插座的插头接通电源，屏幕亮起，显示电源连接不可缺少。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="74" width="86" height="59" rx="5" fill="var(--blue)"/><path d="M80 133v17M61 150h38M125 104h142" fill="none" /><rect x="291" y="81" width="33" height="49" rx="5" fill="var(--paper)"/><path d="M267 93h29v22h-29ZM296 98h13M296 110h13" fill="var(--gold)" /><g transform="translate(80 104) scale(0.7)"><path d="M-12 0l8 8 17-20" fill="none" stroke="var(--green)" stroke-width="5"/></g><text x="180" y="197" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">不可缺少的电源连接</text></g></svg>