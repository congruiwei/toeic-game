<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">参与活动的员工主动举手，另一人自由选择不参加，没有禁止标记。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(86 120) scale(0.9)"><circle cx="0" cy="-25" r="10" fill="var(--paper)"/><path d="M-18 27V2Q0-12 18 2V27" fill="var(--mint)" /><path d="M-9 27v20M9 27v20M-18 8l-13 17M18 8l13 17" fill="none" /></g><path d="M103 115l20-29V57M123 57l-7 9M123 57l8 10" fill="none" /><g transform="translate(268 120) scale(0.9)"><circle cx="0" cy="-25" r="10" fill="var(--paper)"/><path d="M-18 27V2Q0-12 18 2V27" fill="var(--blue)" /><path d="M-9 27v20M9 27v20M-18 8l-13 17M18 8l13 17" fill="none" /></g><path d="M254 167L299 167" fill="none" marker-end="url(#arr)"/><text x="86" y="201" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">自愿报名</text><text x="272" y="201" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">可不参加</text></g></svg>