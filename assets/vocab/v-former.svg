<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">职位时间轴显示过去由左侧员工担任，如今由右侧员工接任。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(82 97) scale(0.8)"><circle cx="0" cy="-25" r="10" fill="var(--paper)"/><path d="M-18 27V2Q0-12 18 2V27" fill="var(--blue)" /><path d="M-9 27v20M9 27v20M-18 8l-13 17M18 8l13 17" fill="none" /></g><g transform="translate(273 97) scale(0.8)"><circle cx="0" cy="-25" r="10" fill="var(--paper)"/><path d="M-18 27V2Q0-12 18 2V27" fill="var(--mint)" /><path d="M-9 27v20M9 27v20M-18 8l-13 17M18 8l13 17" fill="none" /></g><path d="M124 100L230 100" fill="none" marker-end="url(#arr)"/><path d="M36 161h285" fill="none" /><text x="81" y="190" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">过去任职</text><text x="271" y="190" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">现在任职</text></g></svg>