<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">一个圆圈包含三枚圆形标记，方形标记被箭头移到圈外。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="155" cy="107" r="67" fill="var(--paper)"/><circle cx="126" cy="82" r="11" fill="var(--mint)"/><circle cx="179" cy="92" r="11" fill="var(--mint)"/><circle cx="148" cy="135" r="11" fill="var(--mint)"/><rect x="270" y="96" width="26" height="26" rx="5" fill="var(--gold)"/><path d="M206 110L251 110" fill="none" marker-end="url(#arr)"/><text x="159" y="201" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">排除在外</text></g></svg>