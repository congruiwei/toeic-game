<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">账单的标准运费之外，另添一块小额附加费用，合计比基本费用更高。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="61" y="28" width="238" height="168" rx="5" fill="var(--paper)"/><rect x="78" y="66" width="131" height="32" rx="2" fill="var(--mint)"/><rect x="78" y="112" width="44" height="26" rx="2" fill="var(--orange)"/><path d="M151 119v16m-8-8h16M78 151h202" fill="none" /><rect x="78" y="163" width="175" height="18" rx="2" fill="var(--blue)"/><text x="144" y="86" font-size="13" text-anchor="middle" fill="var(--ink)" stroke="none">标准运费</text><text x="204" y="130" font-size="13" text-anchor="middle" fill="var(--ink)" stroke="none">附加费</text><text x="180" y="49" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">账单</text></g></svg>