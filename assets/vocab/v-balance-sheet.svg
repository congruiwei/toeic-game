<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">报表同一日期下列出资产100，以及负债60与所有者权益40。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="54" y="37" width="252" height="151" rx="5" fill="var(--paper)"/><path d="M177 77v96M70 81h218" fill="none" /><text x="120" y="125" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">资产100</text><text x="240" y="110" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">负债60</text><text x="240" y="143" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">权益40</text></g></svg>