<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">已收到的货物旁有一张仍未付款的账单，付款期限还在后面。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(79 112) scale(1.3)"><path d="M-24-18h48v42h-48Z" fill="var(--gold)" /><path d="M0-18v16M-24-18l8-12h32l8 12" fill="none" /></g><g transform="translate(78 173) scale(0.7)"><path d="M-12 0l8 8 17-20" fill="none" stroke="var(--green)" stroke-width="5"/></g><g transform="translate(226 107) scale(1.2)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/></g><text x="226" y="111" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="20">$80</text><g transform="translate(289 153) scale(0.7)"><circle cx="0" cy="0" r="25" fill="var(--paper)"/><path d="M0-16V0l12 7" fill="none" /></g><text x="83" y="207" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">货物已收</text><text x="237" y="207" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">款项未付</text></g></svg>