<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">设备修理费用几乎填满预算条，旁边仅剩很小一段可用资金。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="41" y="78" width="280" height="55" rx="0" fill="var(--paper)"/><rect x="41" y="78" width="238" height="55" rx="0" fill="var(--gold)"/><text x="158" y="111" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">高额维修费</text><path d="M41 148v12h280v-12" fill="none" /><text x="178" y="187" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">占用大部分预算</text></g></svg>