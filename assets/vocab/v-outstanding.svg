<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">尚未付款的账单列着金额50，旁边有等待时钟。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="99" y="38" width="113" height="134" rx="4" fill="var(--paper)"/><text x="155" y="98" font-size="30" text-anchor="middle" fill="var(--ink)" stroke="none">50</text><text x="155" y="142" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">未付</text><g transform="translate(263 134) scale(0.7)"><circle cx="0" cy="0" r="29" fill="var(--paper)"/><path d="M0 -21v23l15 9M-22 0h3M22 0h-3M0 22v-3" fill="none"/></g></g></svg>