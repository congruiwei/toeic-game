<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">支出柱高于收入柱，两者之间的缺口用红线标出。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M65 165h232" fill="none"/><rect x="97" y="104" width="48" height="61" rx="4" fill="var(--mint)"/><rect x="218" y="54" width="48" height="111" rx="4" fill="var(--red)"/><path d="M160 54h43M160 104h43M182 54v50" fill="none"/><text x="121" y="190" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">收入</text><text x="242" y="190" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">支出</text></g></svg>