<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">账户记录入100、出30后，剩余70被圈出。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="83" y="29" width="194" height="164" rx="4" fill="var(--paper)"/><text x="180" y="66" font-size="24" text-anchor="middle" fill="var(--ink)" stroke="none">+100 −30</text><path d="M109 90h142" fill="none"/><circle cx="180" cy="139" r="36" fill="var(--mint)"/><text x="180" y="148" font-size="30" text-anchor="middle" fill="var(--ink)" stroke="none">70</text></g></svg>