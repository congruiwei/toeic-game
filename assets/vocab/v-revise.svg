<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">原稿的一行被删除，修订稿对应一行用新颜色标出。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(90 104) scale(1.3)"><rect x="-24" y="-32" width="48" height="64" rx="4" fill="var(--paper)"/><path d="M-14 -17h28M-14 -5h28M-14 7h21M-14 19h26" fill="none"/></g><path d="M68 101l43 9" fill="none"/><path d="M137 104L221 104" fill="none" marker-end="url(#arr)"/><g transform="translate(270 104) scale(1.3)"><rect x="-24" y="-32" width="48" height="64" rx="4" fill="var(--paper)"/><path d="M-14 -17h28M-14 -5h28M-14 7h21M-14 19h26" fill="none"/></g><rect x="251" y="100" width="37" height="12" rx="4" fill="var(--mint)"/><text x="90" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">修订前</text><text x="270" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">修订后</text></g></svg>