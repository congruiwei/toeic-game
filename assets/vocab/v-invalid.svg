<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">通行证已在昨天到期，验票口亮起红叉而不放行。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="57" width="134" height="89" rx="5" fill="var(--paper)"/><text x="102" y="84" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">有效至 12 / 09</text><text x="102" y="119" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">今天 12 / 10</text><path d="M187 104L227 104" fill="none" marker-end="url(#arr)"/><rect x="251" y="44" width="51" height="131" rx="5" fill="var(--blue)"/><g transform="translate(276 104) scale(1)"><path d="M-9-9L9 9M9-9L-9 9" fill="none" stroke="var(--red)" stroke-width="4"/></g><text x="179" y="199" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">已经失效</text></g></svg>