<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">两根增长的支出柱在红色水平上限处被挡住，不再往上延伸。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="68" y="124" width="48" height="53" rx="2" fill="var(--blue)"/><rect x="155" y="89" width="48" height="88" rx="2" fill="var(--blue)"/><rect x="242" y="67" width="48" height="110" rx="2" fill="var(--mint)"/><path d="M44 66h272" fill="none" stroke="var(--red)" stroke-width="5"/><path d="M267 116L267 81" fill="none" marker-end="url(#arr)"/><text x="180" y="43" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">规定上限</text><text x="180" y="203" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">支出不得越线</text></g></svg>