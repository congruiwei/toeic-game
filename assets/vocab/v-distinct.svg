<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">三只相同瓶子分别用红三角、绿圆和蓝方块标签，区别清楚可辨。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="50" y="75" width="48" height="88" rx="5" fill="var(--paper)"/><rect x="156" y="75" width="48" height="88" rx="5" fill="var(--paper)"/><rect x="262" y="75" width="48" height="88" rx="5" fill="var(--paper)"/><rect x="60" y="56" width="28" height="19" rx="2" fill="var(--gold)"/><rect x="166" y="56" width="28" height="19" rx="2" fill="var(--gold)"/><rect x="272" y="56" width="28" height="19" rx="2" fill="var(--gold)"/><path d="M60 132l14-25 14 25Z" fill="var(--red)" /><circle cx="180" cy="121" r="14" fill="var(--mint)"/><rect x="272" y="107" width="28" height="28" rx="1" fill="var(--blue)"/><text x="180" y="202" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">不同标记，容易区分</text></g></svg>