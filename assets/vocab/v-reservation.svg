<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">日历上的选择与房间床位相连，并打勾表示提前留好住宿。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(90 103) scale(1)"><rect x="-31" y="-30" width="62" height="60" rx="4" fill="var(--paper)"/><rect x="-31" y="-30" width="62" height="15" rx="4" fill="var(--blue)"/><path d="M-17 -37v14M17 -37v14M-19 -4h38M-19 9h38M-8 -10v31M8 -10v31" fill="none"/></g><g transform="translate(270 103) scale(1)"><rect x="-41" y="-12" width="82" height="30" rx="4" fill="var(--blue)"/><rect x="-31" y="-20" width="24" height="17" rx="4" fill="var(--paper)"/><path d="M-41 -24v61M41 -3v40M-41 25h82" fill="none"/></g><path d="M134 103L224 103" fill="none" marker-end="url(#arr)"/><text x="90" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">提前</text><text x="270" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">留位</text></g></svg>