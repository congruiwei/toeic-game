<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">划线停车位内停着一辆车，旁边是停车标记。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="83" y="37" width="125" height="152" rx="4" fill="var(--paper)"/><rect x="110" y="59" width="71" height="111" rx="17" fill="var(--blue)"/><rect x="118" y="77" width="55" height="27" rx="4" fill="var(--paper)"/><rect x="118" y="132" width="55" height="22" rx="4" fill="var(--paper)"/><text x="273" y="120" font-size="48" text-anchor="middle" fill="var(--ink)" stroke="none">P</text></g></svg>