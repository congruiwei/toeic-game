<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">节约的50与增加的50费用放在平衡的天平两端，相互抵消。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M180 58v114M138 174h84M66 78h228" fill="none" /><path d="M87 79l-28 59h56ZM273 79l-28 59h56Z" fill="var(--paper)" /><text x="87" y="117" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">−50</text><text x="273" y="117" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">+50</text><circle cx="180" cy="78" r="6" fill="var(--gold)"/><text x="180" y="204" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">增加与节约抵消</text></g></svg>