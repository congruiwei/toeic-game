<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">两台打印机输出相同页数，右侧只用一个墨盒，左侧需要三个。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="42" y="80" width="84" height="47" rx="5" fill="var(--blue)"/><rect x="233" y="80" width="84" height="47" rx="5" fill="var(--blue)"/><g transform="translate(83 69) scale(0.35)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/><path d="M-15-20h30M-15-7h30M-15 7h30M-15 21h18" fill="none" /></g><g transform="translate(274 69) scale(0.35)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/><path d="M-15-20h30M-15-7h30M-15 7h30M-15 21h18" fill="none" /></g><rect x="50" y="145" width="14" height="25" rx="2" fill="var(--ink)"/><rect x="76" y="145" width="14" height="25" rx="2" fill="var(--ink)"/><rect x="102" y="145" width="14" height="25" rx="2" fill="var(--ink)"/><rect x="268" y="145" width="14" height="25" rx="2" fill="var(--ink)"/><text x="83" y="198" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">相同页数</text><text x="276" y="198" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">更省墨</text></g></svg>