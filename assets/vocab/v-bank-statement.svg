<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">银行对账单按日期排列收入和支出，并在底部显示余额。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="72" y="29" width="216" height="164" rx="5" fill="var(--paper)"/><text x="180" y="57" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">银行对账单</text><path d="M89 70h181M89 150h181" fill="none" /><text x="125" y="95" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">01 / 03</text><text x="233" y="95" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">+200</text><text x="125" y="124" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">01 / 08</text><text x="233" y="124" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">−50</text><text x="180" y="178" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="19">余额 150</text></g></svg>