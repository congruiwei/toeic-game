<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">列车被红色信号灯挡在轨道上，原定时钟旁的等候时钟多走了半小时。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="28" y="82" width="120" height="52" rx="9" fill="var(--blue)"/><rect x="40" y="92" width="29" height="22" rx="5" fill="var(--paper)"/><rect x="79" y="92" width="29" height="22" rx="5" fill="var(--paper)"/><circle cx="53" cy="138" r="10" fill="var(--muted)"/><circle cx="122" cy="138" r="10" fill="var(--muted)"/><path d="M15 153h313m-290 8h280" fill="none" /><path d="M185 56v89" fill="none" /><rect x="170" y="40" width="30" height="59" rx="10" fill="var(--muted)"/><circle cx="185" cy="56" r="8" fill="var(--red)"/><circle cx="185" cy="80" r="8" fill="var(--bg)"/><circle cx="260" cy="74" r="26" fill="var(--paper)"/><g transform="translate(260 74)"><path d="M0 0v-16m0 16 12 0" fill="none" /></g><circle cx="310" cy="129" r="22" fill="var(--paper)"/><g transform="translate(310 129)"><path d="M0 0v14m0-14 11 0" fill="none" /></g><text x="84" y="188" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">信号故障</text><text x="277" y="188" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">延误30分钟</text></g></svg>