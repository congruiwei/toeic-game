<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">供应商根据一台打印机向买方展示写有价格的报价单。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="88" width="74" height="48" rx="5" fill="var(--blue)"/><rect x="45" y="69" width="53" height="29" rx="5" fill="var(--paper)"/><path d="M47 119h47" fill="none" /><path d="M127 110L185 110" fill="none" marker-end="url(#arr)"/><g transform="translate(254 110) scale(1.2)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/></g><text x="254" y="114" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="20">$240</text><text x="181" y="198" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">报出价格</text></g></svg>