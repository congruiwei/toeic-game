<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">三个连续月份均在同一个日期标记一次缴费，没有每周或每天标记。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(65 94) scale(0.85)"><rect x="-30" y="-30" width="60" height="60" rx="5" fill="var(--paper)"/><rect x="-30" y="-30" width="60" height="14" rx="5" fill="var(--blue)"/><path d="M-16-36v12M16-36v12" fill="none" /><text x="0" y="15" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">1月15</text></g><g transform="translate(180 94) scale(0.85)"><rect x="-30" y="-30" width="60" height="60" rx="5" fill="var(--paper)"/><rect x="-30" y="-30" width="60" height="14" rx="5" fill="var(--blue)"/><path d="M-16-36v12M16-36v12" fill="none" /><text x="0" y="15" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">2月15</text></g><g transform="translate(295 94) scale(0.85)"><rect x="-30" y="-30" width="60" height="60" rx="5" fill="var(--paper)"/><rect x="-30" y="-30" width="60" height="14" rx="5" fill="var(--blue)"/><path d="M-16-36v12M16-36v12" fill="none" /><text x="0" y="15" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="18">3月15</text></g><g transform="translate(65 158) scale(0.6)"><circle cx="0" cy="0" r="16" fill="var(--gold)"/></g><g transform="translate(180 158) scale(0.6)"><circle cx="0" cy="0" r="16" fill="var(--gold)"/></g><g transform="translate(295 158) scale(0.6)"><circle cx="0" cy="0" r="16" fill="var(--gold)"/></g></g></svg>