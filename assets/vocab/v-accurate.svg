<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">测量仪读数10.00与标准10.00完全一致，两个数字之间是等号。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="64" width="112" height="75" rx="5" fill="var(--blue)"/><text x="96" y="110" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="23">10.00</text><rect x="215" y="65" width="106" height="74" rx="5" fill="var(--paper)"/><text x="268" y="110" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="23">10.00</text><text x="180" y="170" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="15">测量＝标准</text><g transform="translate(180 186) scale(0.75)"><path d="M-12 0l8 8 17-20" fill="none" stroke="var(--green)" stroke-width="5"/></g><path d="M166 100h28M166 109h28" fill="none"/></g></svg>