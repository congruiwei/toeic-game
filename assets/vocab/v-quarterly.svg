<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">十二个月被分为四组，每组三个月，四次报表日期分别位于各组末尾。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><text x="180" y="30" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">一年</text><rect x="29" y="53" width="66" height="105" rx="5" fill="var(--paper)"/><rect x="38" y="65" width="47" height="21" rx="2" fill="var(--bg)"/><rect x="38" y="93" width="47" height="21" rx="2" fill="var(--bg)"/><rect x="38" y="121" width="47" height="21" rx="2" fill="var(--mint)"/><path d="M55 132l5 5 11-13" fill="none" stroke-width="3.5"/><rect x="109" y="53" width="66" height="105" rx="5" fill="var(--paper)"/><rect x="118" y="65" width="47" height="21" rx="2" fill="var(--bg)"/><rect x="118" y="93" width="47" height="21" rx="2" fill="var(--bg)"/><rect x="118" y="121" width="47" height="21" rx="2" fill="var(--mint)"/><path d="M135 132l5 5 11-13" fill="none" stroke-width="3.5"/><rect x="189" y="53" width="66" height="105" rx="5" fill="var(--paper)"/><rect x="198" y="65" width="47" height="21" rx="2" fill="var(--bg)"/><rect x="198" y="93" width="47" height="21" rx="2" fill="var(--bg)"/><rect x="198" y="121" width="47" height="21" rx="2" fill="var(--mint)"/><path d="M215 132l5 5 11-13" fill="none" stroke-width="3.5"/><rect x="269"