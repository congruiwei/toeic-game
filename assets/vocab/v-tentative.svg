<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">日历上的一个日期用虚线圈住，旁边是问号，尚未最终确定。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(150 108) scale(1.5)"><rect x="-31" y="-30" width="62" height="60" rx="4" fill="var(--paper)"/><rect x="-31" y="-30" width="62" height="15" rx="4" fill="var(--blue)"/><path d="M-17 -37v14M17 -37v14M-19 -4h38M-19 9h38M-8 -10v31M8 -10v31" fill="none"/></g><circle cx="259" cy="91" r="27" fill="var(--paper)"/><text x="259" y="100" font-size="30" text-anchor="middle" fill="var(--ink)" stroke="none">?</text><path d="M120 110h58" fill="none"/></g></svg>