<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">原始借款标为本金，还款图把本金与另列的利息分开。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(24 65) scale(1.7)"><rect x="0" y="0" width="52" height="28" rx="3" fill="var(--mint)"/><circle cx="26" cy="14" r="8" fill="var(--paper)"/><path d="M7 8v12m38-12v12" fill="none" /></g><rect x="179" y="57" width="118" height="68" rx="5" fill="var(--mint)"/><path d="M179 125h118v27H179Z" fill="var(--orange)" /><path d="M117 96L165 96" fill="none" marker-end="url(#arr)"/><path d="M312 58h12v66h-12m0 5h12v23h-12" fill="none" /><text x="68" y="158" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">原借款100</text><text x="238" y="97" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">本金100</text><text x="237" y="145" font-size="13" text-anchor="middle" fill="var(--ink)" stroke="none">利息5</text></g></svg>