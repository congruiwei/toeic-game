<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">原本今天作出的决定被移到下周。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M30 105L330 105" fill="none" marker-end="url(#arr)"/><circle cx="50.0" cy="105" r="9" fill="var(--mint)"/><text x="50.0" y="155" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">今天</text><circle cx="310.0" cy="105" r="9" fill="var(--orange)"/><text x="310.0" y="155" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">下周</text><path d="M55 79q120 -68 247 0" fill="none"/><path d="M290 66l13 13 -19 1" fill="none"/></g></svg>