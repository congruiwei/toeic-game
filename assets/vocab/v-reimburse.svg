<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">先由员工支付购物费用，保留收据后，公司把钱返还员工。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(65 103) scale(0.85)"><rect x="-31" y="-19" width="62" height="38" rx="4" fill="var(--mint)"/><circle cx="0" cy="0" r="11" fill="var(--paper)"/><path d="M-22 0h4M18 0h4" fill="none"/></g><g transform="translate(180 103) scale(0.85)"><path d="M-22 -33h44v66l-7 -5 -8 5 -7 -5 -8 5 -7 -5 -7 5Z" fill="var(--paper)"/><path d="M-13 -19h26M-13 -9h26M-13 5h16M-13 17h26" fill="none"/></g><g transform="translate(295 103) scale(0.85)"><rect x="-31" y="-19" width="62" height="38" rx="4" fill="var(--mint)"/><circle cx="0" cy="0" r="11" fill="var(--paper)"/><path d="M-22 0h4M18 0h4" fill="none"/></g><path d="M109 103L134 103" fill="none" marker-end="url(#arr)"/><path d="M224 103L249 103" fill="none" marker-end="url(#arr)"/><text x="65" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">先垫付</text><text x="180" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">凭收据</text><text x="295" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">后返还</text></g></svg>