<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">同一张仍有效的许可上，旧截止点之后接出一段新增时长，终点向后移动。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="27" y="38" width="65" height="93" rx="5" fill="var(--paper)"/><path d="M36 51h47m-47 11h47m-47 11h47" fill="none" /><path d="M53 100l5 5 11-13" fill="none" stroke-width="3.5"/><path d="M110 112h97" fill="none" stroke-width="14" stroke="var(--mint)"/><path d="M207 112h97" fill="none" stroke-width="14" stroke="var(--orange)"/><path d="M207 76v74" fill="none" stroke-dasharray="4 4"/><path d="M310 82v62" fill="none" /><path d="M207 53L310 53" fill="none" marker-end="url(#arr)"/><text x="68" y="177" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">同一许可</text><text x="207" y="176" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">原期限</text><text x="310" y="176" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">延长期限</text></g></svg>