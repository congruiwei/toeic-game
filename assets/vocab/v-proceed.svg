<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">工作人员在已获批准的检查单后，沿箭头继续铺设地板。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(70 107) scale(1)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/><path d="M-15-20h30M-15-7h30M-15 7h30M-15 21h18" fill="none" /></g><g transform="translate(70 110) scale(1)"><path d="M-12 0l8 8 17-20" fill="none" stroke="var(--green)" stroke-width="5"/></g><path d="M121 109L184 109" fill="none" marker-end="url(#arr)"/><g transform="translate(254 99) scale(0.75)"><circle cx="0" cy="-25" r="10" fill="var(--paper)"/><path d="M-18 27V2Q0-12 18 2V27" fill="var(--blue)" /><path d="M-9 27v20M9 27v20M-18 8l-13 17M18 8l13 17" fill="none" /></g><path d="M213 158h96M220 169h78M250 148v32M282 148v32" fill="none" /><text x="73" y="193" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">已获准</text><text x="253" y="193" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">继续施工</text></g></svg>