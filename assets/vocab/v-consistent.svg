<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">三个批次的成品检测结果均处于同一标准高度，表现始终一致。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="49" y="102" width="58" height="66" rx="2" fill="var(--mint)"/><rect x="151" y="102" width="58" height="66" rx="2" fill="var(--mint)"/><rect x="253" y="102" width="58" height="66" rx="2" fill="var(--mint)"/><path d="M32 102h298" fill="none" stroke="var(--red)" stroke-dasharray="5 4"/><text x="78" y="192" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">批次一</text><text x="180" y="192" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">批次二</text><text x="282" y="192" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">批次三</text></g></svg>