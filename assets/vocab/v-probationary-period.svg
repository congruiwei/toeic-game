<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">从入职到考核的三个月用连续三段标尺表示，末端才决定是否转正。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(48 53) scale(0.75)"><circle cx="0" cy="0" r="12" fill="var(--orange)"/><path d="M-17 43V23q0-10 17-10t17 10v20Z" fill="var(--blue)" /><path d="M-9 43v22m18-22v22" fill="none" /></g><rect x="113" y="49" width="48" height="54" rx="5" fill="var(--paper)"/><rect x="113" y="49" width="48" height="13" rx="3" fill="var(--red)"/><path d="M125 45v10m24-10v10" fill="none" /><rect x="173" y="49" width="48" height="54" rx="5" fill="var(--paper)"/><rect x="173" y="49" width="48" height="13" rx="3" fill="var(--red)"/><path d="M185 45v10m24-10v10" fill="none" /><rect x="233" y="49" width="48" height="54" rx="5" fill="var(--paper)"/><rect x="233" y="49" width="48" height="13" rx="3" fill="var(--red)"/><path d="M245 45v10m24-10v10" fill="none" /><path d="M113 127h168m-168-7v14m168-14v14" fill="none" /><rect x="290" y="100" width="48" height="51" rx="5" fill="var(--mint)"/><path d="M308 126l5 5 11-13" fill="none" stroke-width="3.5"/><path d="M66 145L279 145" fill="none" marker-end="url(#arr)"/><text x="51" y="191" font-size="15" text-anchor="middle" fill="var(--ink)" stroke="none">入职</text><text x="196" y="122" font