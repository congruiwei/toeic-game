<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">公共机构分担一部分公交票款，乘客因此只需支付较少金额。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(68 73) scale(0.65)"><rect x="-33" y="-42" width="66" height="76" rx="5" fill="var(--blue)"/><rect x="-10" y="9" width="20" height="25" rx="5" fill="var(--paper)"/><rect x="-23" y="-29" width="10" height="10" rx="1" fill="var(--paper)"/><rect x="-23" y="-9" width="10" height="10" rx="1" fill="var(--paper)"/><rect x="12" y="-29" width="10" height="10" rx="1" fill="var(--paper)"/><rect x="12" y="-9" width="10" height="10" rx="1" fill="var(--paper)"/><path d="M-42 34h84" fill="none" /></g><g transform="translate(163 69) scale(0.6)"><rect x="-28" y="-16" width="56" height="32" rx="5" fill="var(--mint)"/><circle cx="0" cy="0" r="10" fill="var(--paper)"/><path d="M-20 0h3M17 0h3" fill="none" /></g><path d="M104 72L208 72" fill="none" marker-end="url(#arr)"/><g transform="translate(270 106) scale(0.85)"><rect x="-39" y="-24" width="78" height="44" rx="5" fill="var(--blue)"/><rect x="-30" y="-15" width="13" height="14" rx="5" fill="var(--paper)"/><rect x="-9" y="-15" width="13" height="14" rx="5" fill="var(--paper)"/><rect x="12" y="-15" width="13" height="14" rx="5" fill="var(--paper)"/><circle cx="-24" cy="22" r