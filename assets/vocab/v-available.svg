<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">一把空椅子旁有绿色勾，表示座位现在可以使用。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(160 112) scale(1.4)"><rect x="-22" y="-30" width="44" height="34" rx="4" fill="var(--blue)"/><rect x="-25" y="8" width="50" height="10" rx="4" fill="var(--blue)"/><path d="M-19 18v20M19 18v20M-16 4v4M16 4v4" fill="none"/></g><g transform="translate(246 94) scale(0.65)"><circle cx="0" cy="0" r="29" fill="var(--mint)"/><g transform="translate(0 0) scale(1)"><path d="M-9 0l6 7L11 -10" fill="none"/></g></g></g></svg>