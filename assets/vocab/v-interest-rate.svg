<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">本金1000按年利率5%经过一年，产生50的利息。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(63 109) scale(1)"><rect x="-28" y="-16" width="56" height="32" rx="5" fill="var(--mint)"/><circle cx="0" cy="0" r="10" fill="var(--paper)"/><path d="M-20 0h3M17 0h3" fill="none" /></g><text x="64" y="164" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="15">本金1000</text><path d="M106 107L220 107" fill="none" marker-end="url(#arr)"/><g transform="translate(169 75) scale(0.55)"><rect x="-30" y="-30" width="60" height="60" rx="5" fill="var(--paper)"/><rect x="-30" y="-30" width="60" height="14" rx="5" fill="var(--blue)"/><path d="M-16-36v12M16-36v12" fill="none" /></g><text x="170" y="144" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="17">年利率5%</text><g transform="translate(281 106) scale(1.2)"><circle cx="0" cy="0" r="16" fill="var(--gold)"/></g><text x="281" y="164" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="15">利息50</text></g></svg>