<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">房间采光表的指针刚达到绿色要求区，达到工作所需水平。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M62 139a118 118 0 0 1 236 0" fill="none" stroke-width="16" stroke="var(--blue)"/><path d="M180 21a118 118 0 0 1 118 118" fill="none" stroke-width="16" stroke="var(--green)"/><path d="M180 139l16-102" fill="none" stroke-width="5"/><circle cx="180" cy="139" r="10" fill="var(--gold)"/><text x="180" y="188" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="19">达到要求</text></g></svg>