<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">估计长度标为约10厘米，下面实测长度为9.8厘米，数值接近但不相等。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M60 98h235" fill="none" stroke-width="8"/><path d="M60 119v15h235v-15" fill="none" /><text x="177" y="72" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="23">约 10 cm</text><text x="177" y="163" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="19">实测 9.8 cm</text><text x="177" y="201" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">接近，并非精确相等</text></g></svg>