<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">地球上的三处办公点通过弧线相连，表示跨国协作。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="180" cy="105" r="77" fill="var(--paper)"/><path d="M105 105h150M117 65h126M117 145h126M180 28q-65 78 0 154M180 28q65 78 0 154" fill="none" /><circle cx="136" cy="80" r="10" fill="var(--mint)"/><circle cx="217" cy="95" r="10" fill="var(--gold)"/><circle cx="163" cy="151" r="10" fill="var(--blue)"/><path d="M136 80q42-29 81 15M217 95q-13 50-54 56M163 151q-41-32-27-71" fill="none" /><text x="180" y="207" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">跨国联系</text></g></svg>