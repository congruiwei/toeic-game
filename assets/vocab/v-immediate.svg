<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">按钮按下的同一时刻灯泡就亮起，两个时间标签完全一致。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="79" cy="108" r="24" fill="var(--gold)"/><path d="M117 110L224 110" fill="none" marker-end="url(#arr)"/><circle cx="278" cy="92" r="28" fill="var(--gold)"/><rect x="266" y="119" width="24" height="14" rx="5" fill="var(--blue)"/><path d="M257 58l-8-12M279 50V33M303 58l8-12" fill="none" /><text x="79" y="172" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">10:00:00</text><text x="278" y="172" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">10:00:00</text><text x="180" y="207" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">立即响应</text></g></svg>