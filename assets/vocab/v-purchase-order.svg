<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">采购单列明三箱货物的数量和价格，并由买方向供应方发出。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(113 106) scale(1.7)"><rect x="-25" y="-34" width="50" height="68" rx="5" fill="var(--paper)"/></g><text x="112" y="73" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="15">采购单</text><text x="112" y="104" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="12">数量 3 箱</text><text x="112" y="131" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="12">价格 $90</text><path d="M175 106L223 106" fill="none" marker-end="url(#arr)"/><g transform="translate(279 117) scale(1.2)"><path d="M-24-18h48v42h-48Z" fill="var(--gold)" /><path d="M0-18v16M-24-18l8-12h32l8 12" fill="none" /></g><text x="277" y="185" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">供应方</text></g></svg>