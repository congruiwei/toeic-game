<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">顾客提交商品清单，商店据此准备货物。</title><style>:root{--paper:#faf7ef;--ink:#33434b;--mint:#a9c6b7;--orange:#e9bc80;--blue:#a6bbc9;--muted:#c2c4bc;--red:#dca496;--bg:#e8eee9}@media(prefers-color-scheme:dark){:root{--paper:#313b43;--ink:#e8e8dd;--mint:#608c79;--orange:#af8758;--blue:#577a92;--muted:#6a777c;--red:#ae746b;--bg:#252e35}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(65 103) scale(0.85)"><rect x="-24" y="-32" width="48" height="64" rx="4" fill="var(--paper)"/><path d="M-14 -17h28M-14 -5h28M-14 7h21M-14 19h26" fill="none"/></g><g transform="translate(180 103) scale(0.85)"><rect x="-39" y="-9" width="78" height="52" rx="4" fill="var(--paper)"/><path d="M-44 -9l9 -27h70l9 27Z" fill="var(--orange)"/><rect x="-27" y="5" width="26" height="23" rx="4" fill="var(--blue)"/><rect x="10" y="5" width="18" height="38" rx="4" fill="var(--mint)"/></g><g transform="translate(295 103) scale(0.85)"><path d="M-31 -12L0 -27l31 15v39l-31 15 -31 -15Z" fill="var(--orange)"/><path d="M-31 -12L0 3l31 -15M0 3v39M-15 -20l31 15v15" fill="none"/></g><path d="M109 103L134 103" fill="none" marker-end="url(#arr)"/><path d="M224 103L249 103" fill="none" marker-end="url(#arr)"/><text x="65" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">订单</text><text x="180" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none"></text><text x="295" y="183" font-size="14" text-anchor="middle" fill="var(--ink)" stroke="none">备货</text></g></svg>