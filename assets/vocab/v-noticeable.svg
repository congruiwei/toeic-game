<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title"><title id="title">门牌从灰色小字变为醒目的大号标记，差异一眼可见。</title><style>:root{--paper:#fcf8ee;--ink:#36464e;--mint:#b1d1bc;--green:#378267;--gold:#ebc18b;--blue:#adc4d2;--red:#b55e57;--bg:#eaf0e9}@media(prefers-color-scheme:dark){:root{--paper:#35434a;--ink:#ecece1;--mint:#587d6b;--green:#9fd7bd;--gold:#a9845a;--blue:#567c94;--red:#eea098;--bg:#26343a}}text{font-family:system-ui,-apple-system,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="360" height="220" rx="18" fill="var(--bg)"/><g stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="39" y="60" width="105" height="101" rx="5" fill="var(--paper)"/><text x="92" y="114" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">3</text><path d="M163 108L195 108" fill="none" marker-end="url(#arr)"/><rect x="215" y="60" width="105" height="101" rx="5" fill="var(--gold)"/><text x="267" y="127" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="51">3</text><text x="180" y="201" text-anchor="middle" fill="var(--ink)" stroke="none" font-size="13">明显可见的变化</text></g></svg>